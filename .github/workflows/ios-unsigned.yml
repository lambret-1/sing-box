name: SFI PR 快速检查

on:
  pull_request:
    branches:
      - sing-box-for-apple

concurrency:
  group: sfi-pr-quick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================
  # Job 1：静态检查（约 30s）
  # ============================================================
  quick-check:
    name: 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查冲突标记
        run: |
          if grep -rnE '^(<<<<<<<|=======|>>>>>>>)' \
            --include='*.swift' --include='*.plist' \
            --include='*.pbxproj' --include='*.yml' \
            --include='*.yaml' --include='*.json' \
            --include='*.md' . 2>/dev/null; then
            echo "❌ 发现未解决的冲突标记"
            exit 1
          fi
          echo "✅ 无冲突标记"

      - name: 检查 Info.plist 语法
        run: |
          FOUND=0
          while IFS= read -r -d '' f; do
            FOUND=1
            if ! python3 -c "import plistlib,sys; plistlib.load(open(sys.argv[1],'rb'))" "$f" 2>/dev/null; then
              echo "❌ plist 语法错误: $f"
              exit 1
            fi
          done < <(find . -name 'Info.plist' -not -path './.git/*' -print0)
          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️ 未找到 Info.plist"
          else
            echo "✅ 所有 Info.plist 合法"
          fi

      - name: 检查意外提交的文件 
        run: |
          PATTERNS='\.DS_Store$|xcuserdata/|\.xcworkspace/xcshareddata/|DerivedData/|\.swiftpm/|__pycache__/|\.pyc$'
          FOUND=$(git ls-files | grep -E "$PATTERNS" || true)
          if [ -n "$FOUND" ]; then
            echo "❌ 发现不应提交的文件："
            echo "$FOUND"
            exit 1
          fi
          echo "✅ 无意外文件"

      - name: 检查 pbxproj 有效性
        run: |
          FOUND=0
          while IFS= read -r -d '' f; do
            FOUND=1
            if ! python3 -c "
import sys
content = open(sys.argv[1]).read()
assert content.count('{') == content.count('}'), 'braces mismatch'
assert content.count('(') == content.count(')'), 'parens mismatch'
assert 'rootObject' in content, 'missing rootObject'
" "$f"; then
              echo "❌ pbxproj 可能损坏: $f"
              exit 1
            fi
          done < <(find . -name 'project.pbxproj' -not -path './.git/*' -print0)
          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️ 未找到 project.pbxproj"
          else
            echo "✅ pbxproj 有效"
          fi

      - name: 检查 entitlements
        run: |
          ENT=$(find . -name '*.entitlements' -not -path './.git/*' | head -1)
          if [ -z "$ENT" ]; then
            echo "⚠️ 未找到 entitlements 文件"
            exit 0
          fi
          echo "检查: $ENT"
          if ! grep -q 'com.apple.developer.networking.networkextension' "$ENT"; then
            echo "❌ 缺少关键权限: com.apple.developer.networking.networkextension"
            exit 1
          fi
          if grep -qE 'get-task-allow.*true' "$ENT"; then
            echo "❌ entitlements 包含 get-task-allow=true（调试用，不应提交）"
            exit 1
          fi
          echo "✅ entitlements 检查通过"

      - name: 检查大文件
        run: |
          BIG=$(find . -type f -size +5M -not -path './.git/*' -not -path './build/*' | head -20)
          if [ -n "$BIG" ]; then
            echo "❌ 发现大文件（>5MB），不应提交："
            echo "$BIG"
            exit 1
          fi
          echo "✅ 无异常大文件"

      - name: 检查硬编码密钥
        run: |
          if grep -rniE \
            'BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY|api[_-]?key\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,}|secret\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,}' \
            --include='*.swift' --include='*.plist' --include='*.json' \
            --include='*.yml' --include='*.yaml' --include='*.sh' . 2>/dev/null; then
            echo "❌ 疑似硬编码密钥"
            exit 1
          fi
          echo "✅ 无硬编码密钥"

      - name: 检查空白错误
        run: |
          if ! git diff --check origin/${{ github.base_ref }}...HEAD; then
            echo "❌ 存在空白错误（行尾空格、tab 混用等）"
            exit 1
          fi
          echo "✅ 无空白错误"

      - name: 检查文件末尾换行（警告）
        run: |
          FOUND=$(git ls-files '*.swift' '*.plist' '*.yml' '*.md' | while read -r f; do
            [ -s "$f" ] && [ "$(tail -c1 "$f" | wc -l)" -eq 0 ] && echo "$f"
          done)
          if [ -n "$FOUND" ]; then
            echo "⚠️ 以下文件末尾缺少换行（不阻塞）："
            echo "$FOUND"
          else
            echo "✅ 所有文件末尾有换行"
          fi

      - name: 检查重复文件名（警告）
        run: |
          DUP=$(git ls-files '*.swift' | xargs -n1 basename 2>/dev/null | sort | uniq -d || true)
          if [ -n "$DUP" ]; then
            echo "⚠️ 存在重复文件名（Xcode 可能行为异常，不阻塞）："
            echo "$DUP"
          else
            echo "✅ 无重复文件名"
          fi

      - name: 显示变更文件
        run: |
          echo "=== 本 PR 变更文件 ==="
          git diff --name-only origin/${{ github.base_ref }}...HEAD

  # ============================================================
  # Job 2：SwiftLint（约 40s，与 Job 1 并行）
  # ============================================================
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 SwiftLint 配置
        run: |
          if [ ! -f .swiftlint.yml ]; then
            echo "⚠️ 未找到 .swiftlint.yml，使用默认配置"
            cat > .swiftlint.yml <<'EOF'
          disabled_rules:
            - trailing_whitespace
            - line_length
          opt_in_rules:
            - force_unwrapping
            - empty_count
            - closure_spacing
          EOF
          fi

      - name: 运行 SwiftLint
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:0.57.1 \
            swiftlint lint --strict --quiet \
            --reporter github-actions-logging 2>&1 | tee swiftlint.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "❌ SwiftLint 发现问题（退出码 $STATUS）"
            echo "=== 摘要 ==="
            grep -cE '^::(error|warning)' swiftlint.log || echo "0"
            exit 1
          fi
          echo "✅ SwiftLint 通过"name: iOS Unsigned IPA (TrollStore)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空自动取 git describe）"
        required: false
        default: ""

env:
  SCHEME: SFI
  ARCHIVE_PATH: build/SFI.xcarchive

jobs:
  build:
    name: 构建未签名 IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: 选定 Xcode（macos-15 默认最新版，满足 GRDB 7.11 tools-version 6.1）
        run: |-
          ls /Applications/ | grep -i xcode
          xcodebuild -version

      - name: 计算版本号
        id: ver
        run: |-
          if [ -n "${{ inputs.version }}" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git describe --tags --always --dirty 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 gomobile / gobind
        run: make lib_install

      - name: 编译 Libbox.xcframework
        run: |-
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios
          ls -lh Libbox.xcframework
          rm -rf clients/apple/Libbox.xcframework
          mv Libbox.xcframework clients/apple/

      - name: 对齐 Apple 客户端到 dev 分支（与上游 dev-next 同步 API）
        run: |-
          cd clients/apple
          git fetch origin dev
          git checkout dev
          git submodule update --init --recursive
          git log --oneline -3

      - name: 归档（不签名，保留 entitlements）
        run: |-
          cd clients/apple
          xcodebuild archive \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "../${ARCHIVE_PATH}" \
            -derivedDataPath ../build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            EXPANDED_PROVISIONING_PROFILE_PROPERTIES=""

      - name: 检查归档产物
        run: |-
          APP_PATH="${ARCHIVE_PATH}/Products/Applications"
          ls -lh "$APP_PATH"
          echo "--- 主 App 内容 ---"
          ls -lh "$APP_PATH"/*.app | head
          echo "--- PlugIns（网络扩展） ---"
          find "$APP_PATH" -name "PlugIns" -type d -exec ls -lh {} \;

      - name: 手动打包未签名 IPA（TrollStore 兼容）
        run: |-
          set -e
          STAGE=$(pwd)/build/ipastage
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          APP_SRC="${ARCHIVE_PATH}/Products/Applications"
          # 拷贝主 App（含 PlugIns 内的网络扩展）
          cp -R "$APP_SRC"/*.app "$STAGE/Payload/"
          APP_NAME=$(basename "$APP_SRC"/*.app)
          APP_BUNDLE="$STAGE/Payload/$APP_NAME"

          # TrollStore 需要保留 entitlements：把工程里的 .entitlements 一并放进 app bundle，
          # TrollStore 重签时会读取并注入（networkextension / get-task-allow 等）。
          cd clients/apple
          find . -name "*.entitlements" -not -path "./Pods/*" | while read -r f; do
            rel="${f#./}"
            target="$APP_BUNDLE/$(basename "$rel")"
            cp "$f" "$target"
            echo "注入 entitlements: $rel -> $target"
          done

          # 移除任何残留的 _CodeSignature / embedded.mobileprovision，避免 TrollStore 误判
          find "$STAGE/Payload" \( -name "_CodeSignature" -o -name "embedded.mobileprovision" \) -print -exec rm -rf {} + || true

          # 生成符号表 zip（可选，方便调试崩溃）
          DSYM_SRC="${ARCHIVE_PATH}/dSYMs"
          if [ -d "$DSYM_SRC" ]; then
            (cd "$DSYM_SRC" && zip -qr "../../SFSymbols-${{ steps.ver.outputs.name }}.dSYM.zip" .)
          fi

          # 打包成 IPA
          cd "$STAGE"
          OUT="${GITHUB_WORKSPACE}/App-unsigned.ipa"
          zip -qr "$OUT" Payload
          ls -lh "$OUT"
          echo "IPA 路径: $OUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned
          path: |
            ${{ github.workspace }}/App-unsigned.ipa
            ${{ github.workspace }}/SFSymbols-*.dSYM.zip
          if-no-files-found: error
          retention-days: 14
